# API App wrangler configuration
name = "gsmflow-api"
main = "src/index.ts"
compatibility_date = "2024-12-21"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
minify = false

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "gsmflow-db"
database_id = "your-database-id"
migrations_dir = "migrations"

# KV Storage binding
[[kv_namespaces]]
binding = "KV"
id = "your-kv-id"
preview_id = "your-preview-kv-id"

# Environment variables
[vars]
ENVIRONMENT = "development"
API_VERSION = "1.0.0"
