name = "fullstack-backend"
main = "src/index.ts"
compatibility_date = "2024-12-21"
upload_source_maps = true
minify = false
send_metrics = false

# Smart placement for optimal performance
[placement]
mode = "smart"

# Development configuration
[dev]
port = 8787
ip = "127.0.0.1"
local_protocol = "http"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "fullstack-db"
database_id = "your-database-id-here"  # Replace with actual database ID from `wrangler d1 create`
migrations_dir = "migrations"

# KV Storage binding
[[kv_namespaces]]
binding = "KV"
id = "your-kv-id-here"
preview_id = "your-preview-kv-id"

# R2 Storage binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fullstack-bucket"

# Environment variables (non-sensitive)
[vars]
ENVIRONMENT = "development"

# Custom domains (production)
# routes = [
#   { pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]