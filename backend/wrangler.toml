name = "edge-native-boilerplate-backend"
main = "src/index.ts"
compatibility_date = "2024-12-21"
upload_source_maps = true
minify = false
send_metrics = false

[placement]
mode = "smart"

# Local development is handled via Miniflare (see `bun run dev`).
# Wrangler config is focused on production deployment.

[vars]
ENVIRONMENT = "production"

# Bindings
# To deploy, create resources in your Cloudflare account and add the IDs here.

[[d1_databases]]
binding = "DB"
database_name = "edge-native-db"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "edge-native-bucket"
